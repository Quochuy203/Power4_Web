<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connect 4 Web - Chọn Độ Khó</title>
    <link rel="stylesheet" href="/static/options.css">
    <style>
        /* CSS nội bộ để căn chỉnh nhanh */
        body { text-align: center; font-family: sans-serif; }
        .difficulty-options { display: inline-block; text-align: left; margin-top: 30px; }
        .difficulty-options label { display: block; margin: 10px 0; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Chọn Mức Độ Khó</h1>

    <form action="/play" method="POST">
        
        <input type="hidden" name="mode" value="{{ .GameMode }}"> 
        
        <input type="hidden" name="player1" value="{{ .Player1Name }}">
        <input type="hidden" name="player2" value="{{ .Player2Name }}">

        <div class="difficulty-options">
            <label>
                <input type="radio" name="difficulty" value="6x7" checked> 
                Dễ (6x7 Grid)
            </label>
            <label>
                <input type="radio" name="difficulty" value="6x9"> 
                Bình thường (6x9 Grid)
            </label>
            <label>
                <input type="radio" name="difficulty" value="7x8"> 
                Khó (7x8 Grid)
            </label>
        </div>
        
        <br><br>
        <button type="submit" class="start-game-button">BẮT ĐẦU CHƠI</button>
    </form>
</body>
</html>
