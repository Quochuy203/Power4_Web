<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/options.css">
    <title>Connect4 - Difficulté</title>
</head>
<body class="difficulty-page">
    <div class="header-container">
        <h2 class="welcome-text">Choisissez la difficulté 🎮</h2>
        <h1 class="connect4">CONNECT4</h1>
    </div>

    <div class="difficulty-container">
        <form action="/match" method="POST" class="difficulty-form">
 
            <!-- Bouton Easy -->
            <button type="submit" name="difficulty" value="easy" class="difficulty-button easy">
                <div class="button-icon">🟢</div>
                <div class="button-content">
                    <h3>Facile</h3>
                    <p class="grid-size">Grille 6 x 7</p>
                </div>
            </button>

            <!-- Bouton Normal -->
            <button type="submit" name="difficulty" value="normal" class="difficulty-button normal">
                <div class="button-icon">🟡</div>
                <div class="button-content">
                    <h3>Normal</h3>
                    <p class="grid-size">Grille 6 x 9</p>
                </div>
            </button>

            <!-- Bouton Hard -->
            <button type="submit" name="difficulty" value="hard" class="difficulty-button hard">
                <div class="button-icon">🔴</div>
                <div class="button-content">
                    <h3>Difficile</h3>
                    <p class="grid-size">Grille 7 x 8</p>
                </div>
            </button>

        </form>
    </div>

    <div class="back-link">
        <a href="/mode">← Retour</a>
    </div>
</body>
</html>
