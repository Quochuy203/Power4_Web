<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connect Four</title>
  <link rel="stylesheet" href="../static/match.css">
</head>
<body>
  <div class="game-container">
    <div class="controls">
      <button class="icon">🔊</button>
      <button class="icon">❓</button>
      <button class="icon">🔄</button>
    </div>

    <div class="board">
      <div class="selector">
        <div class="arrow">▼</div>
      </div>
      <div class="grid">
        <div class="grid">
             {{range .Board}}
        <div class="row">
              {{range .}}
        <div class="cell">
          {{if eq . 1}}🔴{{else if eq . 2}}🟡{{else}}⚪{{end}}
        </div>
           {{end}}
        </div>
           {{end}}
      </div>
        <!-- Each cell will be styled via CSS -->
        <div class="row">
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <!-- Repeat .row 6 times -->
        <!-- You can generate this dynamically later -->
      </div>
    </div>

    <div class="status">
      <form method="post" action="/play">
      <button class="player-turn">PLAYER TURN</button>
      <select name="col" class="column-select">
        {{range .column-select}}
        <option value="{{.}}">column {{.}}</option>
        {{end}}
      </select>
      <button class="drop-button">DROP</button>
      <div class="timer"></div>
    </div>
  </div>
</body>
</html>
