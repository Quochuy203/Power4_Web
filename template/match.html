<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connect Four</title>
  <link rel="stylesheet" href="/static/match.css">
</head>
<body>
  <div class="game-container">
    <div class="controls">
      <button class="icon">🔊</button>
      <button class="icon">❓</button>
      <a href="/reset"><button class="icon">🔄</button></a>
    </div>

    <div class="board">
      <form method="post" action="/play">
        <div class="selector">
          <select name="col" class="column-select">
            {{range .ColumnRange}}
              <option value="{{.}}">Column {{.}}</option>
            {{end}}
          </select>
          <button class="drop-button">DROP</button>
        </div>
      </form>

      <div class="grid">
        {{range .Board}}
        <div class="row">
          {{range .}}
          <div class="cell {{if eq . 1}}red{{else if eq . 2}}yellow{{else}}empty{{end}}"></div>
          {{end}}
        </div>
        {{end}}
      </div>
    </div>

    <div class="status">
      <div class="message">{{.Message}}</div>
      <div class="turn">Player {{.CurrentPlayer}}'s Turn</div>
    </div>
  </div>
</body>
</html>
